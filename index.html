<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <script>
      // Guarantee @vitejs/plugin-react preamble detection across dev middleware & iframes
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
    </script>
    <script>
      (function() {
        // Transparent mock for vite-hmr WebSocket to prevent connection failure errors
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function MockHmrSocket(url, protocols) {
            this.url = String(url);
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
            this.readyState = 1; // WebSocket.OPEN
            this.bufferedAmount = 0;
            this.extensions = '';
            this.binaryType = 'blob';
            this.CONNECTING = 0;
            this.OPEN = 1;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this._listeners = {};
            var self = this;
            setTimeout(function() {
              if (typeof self.onopen === 'function') {
                try { self.onopen(new Event('open')); } catch (_) {}
              }
            }, 0);
          }

          MockHmrSocket.prototype = {
            addEventListener: function(type, listener) {
              if (!this._listeners[type]) this._listeners[type] = [];
              this._listeners[type].push(listener);
              if (type === 'open') {
                var self = this;
                setTimeout(function() {
                  try { listener.call(self, new Event('open')); } catch (_) {}
                }, 0);
              }
            },
            removeEventListener: function(type, listener) {
              if (!this._listeners[type]) return;
              this._listeners[type] = this._listeners[type].filter(function(l) { return l !== listener; });
            },
            dispatchEvent: function(event) {
              var listeners = this._listeners[event.type] || [];
              for (var i = 0; i < listeners.length; i++) {
                try { listeners[i].call(this, event); } catch (_) {}
              }
              return true;
            },
            send: function() {},
            close: function() {
              this.readyState = 3; // CLOSED
            }
          };

          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            try {
              var urlStr = String(url);
              var protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
              if (protoStr.includes('vite') || urlStr.includes('vite') || urlStr.includes('24678') || urlStr.includes('token=')) {
                isHmr = true;
              }
            } catch (_) {}

            if (isHmr) {
              return new MockHmrSocket(url, protocols);
            }
            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        const isViteNotice = function(arg) {
          if (!arg) return false;
          try {
            if (typeof arg === 'string') {
              return /\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(arg);
            }
            var text = (arg.message || '') + ' ' + (arg.reason || '') + ' ' + (arg.stack || '') + ' ' + (arg.name || '') + ' ' + (arg.filename || '');
            if (/\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(text)) return true;
            if (arg.target && (arg.target instanceof WebSocket || arg.target.url || arg.target.protocol)) {
              if (/\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(String(arg.target.url || '') + ' ' + String(arg.target.protocol || ''))) return true;
            }
            var str = '';
            try { str = JSON.stringify(arg); } catch (_) { str = String(arg); }
            return /\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(str);
          } catch (_) {
            return false;
          }
        };

        ['error', 'warn', 'info', 'debug', 'log'].forEach(function(method) {
          const orig = console[method];
          if (!orig) return;
          console[method] = function(...args) {
            if (args.some(isViteNotice)) {
              return;
            }
            orig.apply(console, args);
          };
        });

        window.addEventListener('error', function(event) {
          if (
            isViteNotice(event) ||
            isViteNotice(event.message) ||
            isViteNotice(event.error) ||
            (event.filename && isViteNotice(event.filename))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            isViteNotice(event) ||
            isViteNotice(event.reason) ||
            (event.reason && isViteNotice(event.reason.message)) ||
            (event.reason && isViteNotice(event.reason.stack))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>HMIS</title>
    <meta name="description" content="The Tassia Hill Hospital Multi-Tenant Hospital Management Information System (HMIS) with public health and disease surveillance reporting (eIDSR, MOH 505, WHO IHR 2005, KHIS/DHIS2), offline resilience, installable PWA support, dynamic departmental workflows, paperless billing, smart pharmacy POS, and deep integrations with SHA/Taifa Care, KRA eTIMS, and Safaricom M-PESA." />
    <meta property="og:title" content="HMIS" />
    <meta property="og:description" content="The Tassia Hill Hospital Multi-Tenant Hospital Management Information System (HMIS) with public health and disease surveillance reporting (eIDSR, MOH 505, WHO IHR 2005, KHIS/DHIS2), offline resilience, installable PWA support, dynamic departmental workflows, paperless billing, smart pharmacy POS, and deep integrations with SHA/Taifa Care, KRA eTIMS, and Safaricom M-PESA." />
