<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Guarantee @vitejs/plugin-react preamble detection across dev middleware & iframes
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
    </script>
    <script>
      (function() {
        const isViteNotice = function(arg) {
          if (!arg) return false;
          try {
            if (typeof arg === 'string') {
              return /\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(arg);
            }
            if (arg.message && /\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(String(arg.message))) {
              return true;
            }
            if (arg.reason && /\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(String(arg.reason))) {
              return true;
            }
            if (arg.stack && /\[vite\]|vite|websocket/i.test(String(arg.stack))) {
              return true;
            }
            if (arg.filename && /vite|@vite/i.test(String(arg.filename))) {
              return true;
            }
            if (arg.target && (arg.target instanceof WebSocket || (arg.target.url && /ws/i.test(arg.target.url)))) {
              return true;
            }
            const str = String(arg);
            return /\[vite\]|vite|websocket|ws:\/\/|wss:\/\//i.test(str);
          } catch (_) {
            return false;
          }
        };

        ['error', 'warn', 'info', 'debug', 'log'].forEach(function(method) {
          const orig = console[method];
          if (!orig) return;
          console[method] = function(...args) {
            if (args.some(isViteNotice)) {
              return;
            }
            orig.apply(console, args);
          };
        });

        window.addEventListener('error', function(event) {
          if (
            isViteNotice(event) ||
            isViteNotice(event.message) ||
            isViteNotice(event.error) ||
            (event.filename && isViteNotice(event.filename))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            isViteNotice(event) ||
            isViteNotice(event.reason) ||
            (event.reason && isViteNotice(event.reason.message)) ||
            (event.reason && isViteNotice(event.reason.stack))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMIS</title>
    <meta name="description" content="The Tassia Hill Hospital Multi-Tenant Hospital Management Information System (HMIS) with offline resilience, installable PWA support, dynamic departmental workflows, paperless billing, smart pharmacy POS, and deep integrations with SHA/Taifa Care, KRA eTIMS, and Safaricom M-PESA." />
    <meta property="og:title" content="HMIS" />
    <meta property="og:description" content="The Tassia Hill Hospital Multi-Tenant Hospital Management Information System (HMIS) with offline resilience, installable PWA support, dynamic departmental workflows, paperless billing, smart pharmacy POS, and deep integrations with SHA/Taifa Care, KRA eTIMS, and Safaricom M-PESA." />
    <meta name="theme-color" content="#047857" />

    <meta name="apple-mobile-web-app-title" content="HMIS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  </head>

  </body>
